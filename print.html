<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cards of Civilization — Design Document</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/cards.css" />
  <link rel="stylesheet" href="src/styles/menu.css" />
  <link rel="stylesheet" href="src/styles/forms.css" />
  <link rel="stylesheet" href="src/styles/lobby.css" />
  <link rel="stylesheet" href="src/styles/game.css" />
  <link rel="stylesheet" href="src/styles/rules.css" />

  <style>
    /* Print-ready overrides — show all screens as stacked pages */
    body { background: var(--ink-900); }
    .print-doc { display: block; }
    .print-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--ink-900);
      page-break-after: always;
      break-after: page;
      border-bottom: 1px dashed var(--ink-700);
    }
    .print-page:last-child {
      page-break-after: auto;
      break-after: auto;
      border-bottom: none;
    }
    .print-label {
      position: absolute;
      top: 14px;
      right: 18px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold-400);
      z-index: 20;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--gold-500);
    }
    /* Force-show backgrounds, hide chrome */
    .mobile-nav-toggle, .devnav { display: none !important; }
    /* Override fixed/scroll layouts so content prints fully */
    .board {
      height: auto !important;
      min-height: 0 !important;
    }
    .center-stage {
      overflow: visible !important;
      max-height: none !important;
    }
    .chronicle-float {
      max-height: none !important;
      min-height: 0 !important;
      overflow: visible !important;
    }
    .menu, .panel-wrap, .endscreen {
      min-height: 0 !important;
      padding-top: 80px !important;
      padding-bottom: 80px !important;
    }
    .modal-backdrop { display: none !important; }
    .toast { display: none !important; }

    /* Print rules */
    @media print {
      @page { size: A4 landscape; margin: 0.4cm; }
      html, body {
        background: var(--ink-900) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .print-page {
        page-break-after: always;
        break-after: page;
        border-bottom: none;
        min-height: 19cm; /* landscape A4 minus margins */
      }
      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      /* Avoid splitting cards / panels mid-element */
      .card, .opp-card, .panel, .vc, .res-tile {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      /* Rules page — let it flow naturally across pages */
      .rules-page section {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .rules-page h2 {
        page-break-after: avoid;
        break-after: avoid;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/data/cards.jsx"></script>
  <script type="text/babel" src="src/data/players.jsx"></script>
  <script type="text/babel" src="src/utils/token.jsx"></script>

  <script type="text/babel" src="src/components/Avatar.jsx"></script>
  <script type="text/babel" src="src/components/CardView.jsx"></script>
  <script type="text/babel" src="src/components/DevNav.jsx"></script>

  <script type="text/babel" src="src/screens/Menu.jsx"></script>
  <script type="text/babel" src="src/screens/Create.jsx"></script>
  <script type="text/babel" src="src/screens/Join.jsx"></script>
  <script type="text/babel" src="src/screens/Lobby.jsx"></script>
  <script type="text/babel" src="src/screens/Game.jsx"></script>
  <script type="text/babel" src="src/screens/End.jsx"></script>
  <script type="text/babel" src="src/screens/Rules.jsx"></script>

  <script type="text/babel">
    const noop = () => {};

    function CoverPage() {
      return (
        <section className="print-page" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",padding:"60px"}}>
          <div className="print-label">Design Document</div>
          <div style={{width:60,height:60,border:"1px solid var(--gold-500)",display:"grid",placeItems:"center",transform:"rotate(45deg)",marginBottom:28}}>
            <div style={{width:24,height:24,background:"var(--gold-500)"}}></div>
          </div>
          <h1 style={{fontFamily:"var(--font-display)",fontSize:84,margin:0,color:"var(--parch-50)",lineHeight:0.95,fontWeight:400}}>
            Cards of<br/><em style={{color:"var(--gold-400)",fontStyle:"italic"}}>Civilization</em>
          </h1>
          <div style={{marginTop:24,fontFamily:"var(--font-mono)",fontSize:12,letterSpacing:"0.25em",textTransform:"uppercase",color:"var(--ink-300)"}}>
            Full Design Document
          </div>
          <div style={{marginTop:60,fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--ink-400)",display:"flex",gap:24}}>
            <span>3–8 players</span><span>·</span><span>Turn based</span><span>·</span><span>v0.1 prototype</span>
          </div>
          <ol style={{marginTop:80,padding:0,listStyle:"none",fontFamily:"var(--font-mono)",fontSize:13,color:"var(--ink-200)",lineHeight:2,textAlign:"left",columnCount:2,columnGap:60}}>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>01</span>Main Menu</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>02</span>Create Game</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>03</span>Join Game</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>04</span>Lobby</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>05</span>Game Board</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>06</span>Victory</li>
            <li><span style={{color:"var(--ink-500)",marginRight:12}}>07</span>Rules</li>
          </ol>
        </section>
      );
    }

    function PrintDoc() {
      const { Menu, Create, Join, Lobby, Game, End, Rules } = window;
      const pages = [
        { label: "01 · Main Menu",    Comp: Menu,   props: { goto: noop } },
        { label: "02 · Create Game",  Comp: Create, props: { goto: noop, setToken: noop, setHostName: noop } },
        { label: "03 · Join Game",    Comp: Join,   props: { goto: noop, setToken: noop } },
        { label: "04 · Lobby",        Comp: Lobby,  props: { goto: noop, token: "A7K2QM", hostName: "Aurelia" } },
        { label: "05 · Game Board",   Comp: Game,   props: { goto: noop } },
        { label: "06 · Victory",      Comp: End,    props: { goto: noop } },
        { label: "07 · Rules",        Comp: Rules,  props: { goto: noop } },
      ];
      return (
        <div className="print-doc">
          <CoverPage />
          {pages.map(p => (
            <section key={p.label} className="print-page">
              <span className="print-label">{p.label}</span>
              <p.Comp {...p.props} />
            </section>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PrintDoc />);

    // Auto-print once fonts + layout are ready
    (async () => {
      try {
        if (document.fonts && document.fonts.ready) {
          await document.fonts.ready;
        }
      } catch (e) {}
      setTimeout(() => window.print(), 1500);
    })();
  </script>
</body>
</html>
